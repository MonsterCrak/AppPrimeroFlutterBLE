name: app_primero_flutter_ble
description: "Emulador de posicionamiento BLE en interiores con Flutter — validación de lógica espacial con balizas Feasycom FSC-BP104D (BLE 5.1, chip Dialog DA14531)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado reactivo (MVVM lightweight)
  provider: ^6.1.2

  # Permisos runtime (Bluetooth, ubicación)
  permission_handler: ^11.3.1

  # Escaneo BLE iBeacon (Modo Real BLE — Android + iOS uniforme).
  # Usa CoreLocation en iOS (requerido por Apple para iBeacons) y
  # Android-Beacon-Library en Android.
  #
  # Usamos el fork `dchs_flutter_beacon` porque el `flutter_beacon`
  # original (v0.5.1) está abandonado hace 5 años y no compila con
  # AGP 8+ (falta namespace en su build.gradle y usa API legacy de
  # PluginRegistry.Registrar). El fork está mantenido, portado a
  # Kotlin, y mantiene la misma API pública.
  dchs_flutter_beacon: 0.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Mocks para tests (flutter_blue_plus, permission_handler)
  mocktail: ^1.0.4

  # Tests asincronos deterministas
  fake_async: ^1.3.1

flutter:
  uses-material-design: true